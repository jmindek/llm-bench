[project]
name = "llm-bench"
version = "0.1.0"
description = "LLM benchmark scripts"
requires-python = ">=3.11"
dependencies = [
    "ruff>=0.17.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16.0",
    "bandit>=1.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["scripts"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 25
exclude_lines = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
