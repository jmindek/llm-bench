name: Test & Lint
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install ruff pytest
      - name: Run ruff
        run: ruff check . && ruff format .
      - name: Install gitleaks
        run: |
          cd /tmp
          curl -LO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/
          rm gitleaks_8.30.1_linux_x64.tar.gz

      - name: Scan for secrets
        run: gitleaks detect --source . --verbose --exit-code 1

      - name: Run tests
        run: pytest tests/ -v
